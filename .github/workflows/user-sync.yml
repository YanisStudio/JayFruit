name: User Data Sync

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch: {}

jobs:
  sync-users:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts/user-sync
        run: npm install

      - name: Run user sync
        working-directory: scripts/user-sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node run.mjs

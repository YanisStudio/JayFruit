<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- firebase-warmup：讓瀏覽器一開始解析頁面就先跟 Firebase 握手、下載 SDK，
         不用等到下面載入 Firebase 的 module 腳本才開始。版本號要跟 import 的一致。 -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-lite.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js">
    <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16.png">

    <link rel="stylesheet" href="../css/admin-common.css?v=20261014">

    <!-- 保持原版的 Firebase 初始化方式以確保兼容性 -->
    <script src="../js/firebase-config.js?v=20261014"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
          getAuth,
          onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import {
          initializeFirestore,
            terminate,
          collection,
          addDoc,
          getDoc,
          getDocs,
          getDocs as getDocsFromServer,
          doc,
          updateDoc,
          deleteDoc,
          setDoc,
          query,
          orderBy,
          where,
          serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-lite.js";

        const firebaseConfig = window.FIREBASE_CONFIG;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        // 連線設定統一放在 js/firebase-config.js 的 FIRESTORE_SETTINGS（原因寫在那裡）
        const db = initializeFirestore(app, window.FIRESTORE_SETTINGS);

        window.firebaseServices = {
          auth: auth,
          db: db,
          app: app,
          initializeFirestore,
          terminate,
          getAuth,
          onAuthStateChanged,
          collection,
          addDoc,
          getDoc,
          getDocs,
          getDocsFromServer,
          doc,
          updateDoc,
          deleteDoc,
          setDoc,
          query,
          orderBy,
          where,
          serverTimestamp
        };
    </script>
</head>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        let freeShippingSettings = { enabled: false, threshold: 0 };
        let calculationMode = 'fixed';
        let fixedRates = {
            home: 0
        };
        let tieredRates = {
            home: []
        };

        const categoryMap = {
            'pear': '梨子',
            'persimmon': '甜柿',
            'peach': '水蜜桃',
            'apple': '蘋果',
            'gift': '禮盒',
            'featured': '特色商品'
        };

        // 階梯式運費試算跟前台購物車／結帳頁共用 js/shipping-calc.js，試算結果才會跟顧客實際付的一樣
        const calculateTieredShipping = function(quantity, categoryRates) {
            const result = ShippingCalc.calculateTiered(quantity, categoryRates);
            return { fee: result.fee, description: result.descriptions.join('，') };
        };

        // 讀到設定之前先停用所有儲存／新增按鈕：讀取失敗時表單停在預設值（免運關閉、運費 0），
        // 這時候按儲存會把資料庫裡真正的設定蓋掉
        const setEditingEnabled = function(enabled) {
            document.querySelectorAll('#save-free-shipping, #save-calculation-mode, .save-fixed-rates, .add-tier').forEach(btn => {
                btn.disabled = !enabled;
            });
        };

        const waitForAdminCommon = function() {
            if (window.AdminCommon) {
                checkAdminAccess();
            } else {
                setTimeout(waitForAdminCommon, 100);
            }
        };

        const checkAdminAccess = function() {
            window.AdminCommon.checkAdminAccess(
                function(user) {
                    // 設置用戶名顯示 - 顯示"管理員"而不是郵箱
                    const usernameDisplay = document.getElementById('username-display');
                    if (usernameDisplay) {
                        usernameDisplay.textContent = '管理員';
                    }

                    bindEvents();
                    loadAllSettings();
                },
                function(error) {
                    setTimeout(() => {
                        window.location.href = '../index.html';
                    }, 2000);
                }
            );
        };

        const bindEvents = function() {
            const freeShippingToggle = document.getElementById('enable-free-shipping');
            if (freeShippingToggle) {
                freeShippingToggle.addEventListener('change', function() {
                    const thresholdSetting = document.getElementById('threshold-setting');
                    if (this.checked) {
                        thresholdSetting.classList.add('enabled');
                    } else {
                        thresholdSetting.classList.remove('enabled');
                    }
                });
            }

            const saveFreeShippingBtn = document.getElementById('save-free-shipping');
            if (saveFreeShippingBtn) {
                saveFreeShippingBtn.addEventListener('click', saveFreeShippingSettings);
            }

            const modeRadios = document.querySelectorAll('input[name="calculation-mode"]');
            modeRadios.forEach(radio => {
                radio.addEventListener('change', function() {
                    updateModeDisplay();
                    document.querySelectorAll('.mode-option').forEach(option => {
                        option.classList.remove('active');
                    });
                    this.closest('.mode-option').classList.add('active');
                });
            });

            const saveModeBtn = document.getElementById('save-calculation-mode');
            if (saveModeBtn) {
                saveModeBtn.addEventListener('click', saveCalculationMode);
            }

            const saveFixedBtns = document.querySelectorAll('.save-fixed-rates');
            saveFixedBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const method = this.dataset.method;
                    saveFixedRates(method);
                });
            });

            const addTierBtns = document.querySelectorAll('.add-tier');
            addTierBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const method = this.dataset.method;
                    addTier(method);
                });
            });

            const addCartItemBtn = document.getElementById('add-cart-item');
            if (addCartItemBtn) {
                addCartItemBtn.addEventListener('click', addCartItem);
            }

            bindRemoveItemEvents();

            const deliveryOptions = document.querySelectorAll('input[name="test-delivery-method"]');
            deliveryOptions.forEach(option => {
                option.addEventListener('change', function() {
                    document.querySelectorAll('.delivery-option').forEach(opt => {
                        opt.classList.remove('selected');
                    });
                    this.closest('.delivery-option').classList.add('selected');
                });
            });

            const calculateBtn = document.getElementById('calculate-shipping');
            if (calculateBtn) {
                calculateBtn.addEventListener('click', calculateShipping);
            }
        };

        // 一次讀完所有運費設定；連線失敗會自動重試（AdminCommon.loadWithRetry），
        // 不會在讀不到的時候顯示預設值讓管理員誤以為設定不見了
        const loadAllSettings = async function() {
            setEditingEnabled(false);
            const statusEl = document.getElementById('shipping-load-status');
            if (statusEl) {
                statusEl.textContent = '正在載入運費設定…';
                statusEl.style.display = 'block';
            }

            let config;
            try {
                config = await window.AdminCommon.loadWithRetry(
                    () => ShippingCalc.load(window.firebaseServices),
                    (attempt) => {
                        if (statusEl && attempt >= 2) statusEl.textContent = '網路連線不穩定，正在重新連線中…（設定讀到之前無法儲存）';
                    }
                );
            } catch (error) {
                window.AdminCommon.handleError(error, '載入運費設定');
                if (statusEl) statusEl.textContent = '無法載入運費設定，請重新整理頁面。';
                return;
            }

            freeShippingSettings = { ...config.freeShipping };
            calculationMode = config.calculationMode;
            fixedRates.home = config.fixedRates.home;
            tieredRates.home = config.tieredRates.home.slice();

            const enableCheckbox = document.getElementById('enable-free-shipping');
            const thresholdInput = document.getElementById('free-shipping-threshold');
            const thresholdSetting = document.getElementById('threshold-setting');
            if (enableCheckbox) enableCheckbox.checked = freeShippingSettings.enabled;
            if (thresholdInput) thresholdInput.value = freeShippingSettings.threshold || '';
            if (thresholdSetting) thresholdSetting.classList.toggle('enabled', freeShippingSettings.enabled);

            const modeRadio = document.querySelector(`input[name="calculation-mode"][value="${calculationMode}"]`);
            if (modeRadio) {
                modeRadio.checked = true;
                document.querySelectorAll('.mode-option').forEach(option => option.classList.remove('active'));
                modeRadio.closest('.mode-option').classList.add('active');
            }
            updateModeDisplay();
            updateFixedRatesUI();
            updateTieredRatesUI();

            if (statusEl) statusEl.style.display = 'none';
            setEditingEnabled(true);
        };

        const updateModeDisplay = function() {
            const isFixed = calculationMode === 'fixed';

            const homeFixed = document.getElementById('home-fixed-rates');
            const homeTiered = document.getElementById('home-tiered-rates');

            if (homeFixed) homeFixed.style.display = isFixed ? 'block' : 'none';
            if (homeTiered) homeTiered.style.display = isFixed ? 'none' : 'block';
        };

        const updateFixedRatesUI = function() {
            const homeFixedInput = document.getElementById('home-fixed-fee');

            // 0 元是合法的運費，要顯示 0，不能顯示成空白
            if (homeFixedInput) homeFixedInput.value = Number.isFinite(fixedRates.home) ? fixedRates.home : '';
        };

        const updateTieredRatesUI = function() {
            updateTieredList('home');
        };

        const updateTieredList = function(method) {
            const container = document.getElementById(`${method}-tiers-list`);
            if (!container) return;

            const rates = tieredRates[method] || [];

            if (rates.length === 0) {
                container.innerHTML = '<div class="empty-tiers">尚未設定階梯運費</div>';
                return;
            }

            let html = '';
            rates.forEach(rate => {
                const categoryName = categoryMap[rate.category] || rate.category;
                html += `
                    <div class="tier-item">
                        <div class="tier-info">
                            <div class="tier-category">${window.AdminCommon.escapeHtml(categoryName)}</div>
                            <div class="tier-range">${rate.minQuantity} - ${rate.maxQuantity > 0 ? rate.maxQuantity : '不限'} 個</div>
                        </div>
                        <div class="tier-fee">NT$ ${rate.fee}</div>
                        <button class="btn btn-danger btn-sm delete-tier" data-id="${window.AdminCommon.escapeHtml(rate.id)}" data-method="${method}">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
            });

            container.innerHTML = html;
            bindTierDeleteEvents();
        };

        const bindTierDeleteEvents = function() {
            const deleteBtns = document.querySelectorAll('.delete-tier');
            deleteBtns.forEach(btn => {
                btn.addEventListener('click', async function() {
                    const id = this.dataset.id;
                    const method = this.dataset.method;

                    const confirmed = await window.AdminCommon.showConfirmDialog(
                        '確定要刪除這個階梯設定嗎？',
                        '刪除階梯'
                    );

                    if (confirmed) {
                        deleteTier(id, method);
                    }
                });
            });
        };

        const bindRemoveItemEvents = function() {
            const removeBtns = document.querySelectorAll('.remove-item');
            removeBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    this.closest('.cart-item').remove();
                });
            });
        };

        const saveFreeShippingSettings = async function() {
            const user = window.firebaseServices.auth.currentUser;
            if (!user) {
                window.AdminCommon.showToast('您必須登入才能保存免運設定', 'warning');
                return;
            }

            const enabled = document.getElementById('enable-free-shipping').checked;
            const thresholdValue = parseInt(document.getElementById('free-shipping-threshold').value, 10);
            if (enabled && (!Number.isFinite(thresholdValue) || thresholdValue < 0)) {
                window.AdminCommon.showToast('請輸入免運門檻金額', 'warning');
                return;
            }
            const threshold = enabled ? thresholdValue : 0;

            window.AdminCommon.showLoading('儲存免運設定中...');

            try {
                const db = window.firebaseServices.db;

                const settings = {
                    enabled,
                    threshold,
                    updatedAt: window.firebaseServices.serverTimestamp()
                };

                const docRef = window.firebaseServices.doc(db, 'shippingSettings', 'freeShipping');
                await window.firebaseServices.setDoc(docRef, settings);

                freeShippingSettings = { enabled, threshold };
                window.AdminCommon.showToast('免運設定已儲存', 'success');

            } catch (error) {
                window.AdminCommon.handleError(error, '儲存免運設定');
            } finally {
                window.AdminCommon.hideLoading();
            }
        };

        const saveCalculationMode = async function() {
            const user = window.firebaseServices.auth.currentUser;
            if (!user) {
                window.AdminCommon.showToast('您必須登入才能保存計算模式', 'warning');
                return;
            }

            const mode = document.querySelector('input[name="calculation-mode"]:checked').value;

            window.AdminCommon.showLoading('儲存計算模式中...');

            try {
                const db = window.firebaseServices.db;
                const { doc, setDoc, serverTimestamp } = window.firebaseServices;

                await setDoc(doc(db, 'shippingSettings', 'calculationMode'), {
                    mode: mode,
                    updatedAt: serverTimestamp()
                });

                calculationMode = mode;
                updateModeDisplay();
                window.AdminCommon.showToast('計算模式已儲存', 'success');

            } catch (error) {
                window.AdminCommon.handleError(error, '儲存計算模式');
            } finally {
                window.AdminCommon.hideLoading();
            }
        };

        const saveFixedRates = async function(method) {
            const user = window.firebaseServices.auth.currentUser;
            if (!user) {
                window.AdminCommon.showToast('您必須登入才能保存固定運費', 'warning');
                return;
            }

            // 空白時 parseInt 是 NaN，存進資料庫會讓購物車顯示「NT$ NaN」；0 元是合法的，不能用 !fee 判斷
            const fee = parseInt(document.getElementById(`${method}-fixed-fee`).value, 10);
            if (!Number.isFinite(fee) || fee < 0) {
                window.AdminCommon.showToast('請輸入運費金額（免運費請填 0）', 'warning');
                return;
            }

            window.AdminCommon.showLoading('儲存固定運費中...');

            try {
                const db = window.firebaseServices.db;
                const { doc, setDoc, serverTimestamp } = window.firebaseServices;

                // 只寫這一種配送方式的欄位並 merge：整份覆蓋的話，記憶體裡另一種配送方式
                // 如果還是預設的 0，就會把資料庫裡真正的運費一起蓋成 0
                await setDoc(doc(db, 'shippingRates', 'fixedRates'), {
                    [method]: fee,
                    updatedAt: serverTimestamp()
                }, { merge: true });
                fixedRates[method] = fee;

                const methodName = method === 'home' ? '宅配' : '超商';
                window.AdminCommon.showToast(`${methodName}固定運費已儲存`, 'success');

            } catch (error) {
                window.AdminCommon.handleError(error, '儲存固定運費');
            } finally {
                window.AdminCommon.hideLoading();
            }
        };

        const addTier = async function(method) {
            const user = window.firebaseServices.auth.currentUser;
            if (!user) {
                window.AdminCommon.showToast('您必須登入才能新增階梯運費', 'warning');
                return;
            }

            const category = document.getElementById(`${method}-tier-category`).value;
            const minQuantity = parseInt(document.getElementById(`${method}-tier-min`).value, 10);
            const maxQuantity = parseInt(document.getElementById(`${method}-tier-max`).value, 10);
            const fee = parseInt(document.getElementById(`${method}-tier-fee`).value, 10);

            // parseInt 空白是 NaN，`fee === undefined` 永遠擋不住；運費 0 元是合法的，不能用 !fee
            if (!category || !Number.isFinite(minQuantity) || minQuantity < 1 ||
                !Number.isFinite(maxQuantity) || maxQuantity < 1 ||
                !Number.isFinite(fee) || fee < 0) {
                window.AdminCommon.showToast('請填寫完整的階梯資料（數量至少 1，運費不可空白）', 'warning');
                return;
            }

            if (maxQuantity < minQuantity) {
                window.AdminCommon.showToast('最大數量不能小於最小數量', 'error');
                return;
            }

            const existing = tieredRates[method] || [];
            const overlapping = existing.some(rate => {
                return rate.category === category &&
                       !(maxQuantity < rate.minQuantity || minQuantity > rate.maxQuantity);
            });

            if (overlapping) {
                window.AdminCommon.showToast('此數量區間與現有階梯重疊', 'error');
                return;
            }

            window.AdminCommon.showLoading('新增階梯中...');

            try {
                const db = window.firebaseServices.db;
                const { collection, addDoc, serverTimestamp } = window.firebaseServices;

                const tierData = {
                    method,
                    category,
                    minQuantity,
                    maxQuantity,
                    fee,
                    createdAt: serverTimestamp()
                };

                const docRef = await addDoc(collection(db, 'tieredRates'), tierData);

                tierData.id = docRef.id;
                tieredRates[method].push(tierData);
                tieredRates[method].sort((a, b) => a.minQuantity - b.minQuantity);

                document.getElementById(`${method}-tier-category`).value = '';
                document.getElementById(`${method}-tier-min`).value = '';
                document.getElementById(`${method}-tier-max`).value = '';
                document.getElementById(`${method}-tier-fee`).value = '';

                window.AdminCommon.showToast('階梯已新增', 'success');
                updateTieredList(method);

            } catch (error) {
                window.AdminCommon.handleError(error, '新增階梯');
            } finally {
                window.AdminCommon.hideLoading();
            }
        };

        const deleteTier = async function(id, method) {
            window.AdminCommon.showLoading('刪除階梯中...');
            try {
                const db = window.firebaseServices.db;
                const { doc, deleteDoc } = window.firebaseServices;

                await deleteDoc(doc(db, 'tieredRates', id));

                tieredRates[method] = tieredRates[method].filter(rate => rate.id !== id);

                window.AdminCommon.showToast('階梯設定已刪除', 'success');
                updateTieredList(method);

            } catch (error) {
                window.AdminCommon.handleError(error, '刪除階梯');
            } finally {
                window.AdminCommon.hideLoading();
            }
        };

        const addCartItem = function() {
            const cartItems = document.getElementById('cart-items');
            if (!cartItems) return;

            const newItem = document.createElement('div');
            newItem.className = 'cart-item';
            newItem.innerHTML = `
                <select class="item-category">
                    <option value="">選擇水果種類</option>
                    <option value="pear">梨子</option>
                    <option value="persimmon">甜柿</option>
                    <option value="peach">水蜜桃</option>
                    <option value="apple">蘋果</option>
                    <option value="gift">禮盒</option>
                    <option value="featured">特色商品</option>
                </select>
                <input type="number" class="item-quantity" placeholder="數量" min="1" step="1">
                <input type="number" class="item-price" placeholder="單價(可選)" min="0" step="1">
                <button type="button" class="btn btn-danger btn-sm remove-item">
                    <i class="fas fa-trash"></i>
                </button>
            `;

            cartItems.appendChild(newItem);
            bindRemoveItemEvents();
        };

        const calculateShipping = function() {
            const deliveryMethod = 'home'; // 只有宅配到府
            const cartItems = document.querySelectorAll('.cart-item');

            let totalAmount = 0;
            let cartData = [];

            cartItems.forEach(item => {
                const category = item.querySelector('.item-category').value;
                const quantity = parseInt(item.querySelector('.item-quantity').value);
                const price = parseInt(item.querySelector('.item-price').value) || 0;

                if (category && quantity) {
                    const itemTotal = quantity * price;
                    totalAmount += itemTotal;

                    cartData.push({
                        category,
                        quantity,
                        price: price || '未填入',
                        total: itemTotal
                    });
                }
            });

            if (cartData.length === 0) {
                window.AdminCommon.showToast('請至少新增一個商品項目', 'warning');
                return;
            }

            // 如果有填入單價且達到免運門檻
            if (freeShippingSettings.enabled && totalAmount > 0 && totalAmount >= freeShippingSettings.threshold) {
                showCalculationResult({
                    shippingFee: 0,
                    totalAmount,
                    isFreeShipping: true,
                    hasPrice: totalAmount > 0,
                    details: `購買金額 NT$ ${totalAmount.toLocaleString()} 達到免運門檻 NT$ ${freeShippingSettings.threshold.toLocaleString()}`
                });
                return;
            }

            let shippingFee = 0;
            let details = [];

            if (calculationMode === 'fixed') {
                // 固定運費計算 - 簡化版本
                const fixedFee = fixedRates[deliveryMethod] || 0;

                if (cartData.length > 0) {
                    shippingFee = fixedFee;
                    details.push(`固定運費：NT$ ${fixedFee}`);
                }

            } else {
                // 階梯式運費計算
                const rates = tieredRates[deliveryMethod];
                const categoryTotals = {};

                cartData.forEach(item => {
                    if (!categoryTotals[item.category]) {
                        categoryTotals[item.category] = 0;
                    }
                    categoryTotals[item.category] += item.quantity;
                });

                Object.keys(categoryTotals).forEach(category => {
                    const quantity = categoryTotals[category];
                    const categoryRates = rates.filter(r => r.category === category);

                    if (categoryRates.length === 0) {
                        details.push(`${categoryMap[category]} ${quantity}個：未設定階梯運費，NT$ 0`);
                        return;
                    }

                    const result = calculateTieredShipping(quantity, categoryRates);
                    shippingFee += result.fee;
                    details.push(`${categoryMap[category]} ${quantity}個：${result.description}`);
                });
            }

            showCalculationResult({
                shippingFee,
                totalAmount,
                isFreeShipping: false,
                hasPrice: totalAmount > 0,
                details: details.join('<br>')
            });
        };

        const showCalculationResult = function(result) {
            const resultContainer = document.getElementById('calculation-result');
            const resultSummary = document.getElementById('result-summary');
            const resultDetails = document.getElementById('result-details');

            if (!resultContainer || !resultSummary || !resultDetails) return;

            const deliveryMethod = 'home';
            const methodName = '宅配到府';
            const modeName = calculationMode === 'fixed' ? '固定運費' : '階梯式運費';

            if (result.isFreeShipping) {
                resultSummary.innerHTML = `
                    <strong>🎉 符合免運條件！</strong><br>
                    商品總金額：NT$ ${result.totalAmount.toLocaleString()}<br>
                    運費：<span style="color: #4caf50; font-weight: bold;">NT$ 0（免運）</span><br>
                    訂單總額：NT$ ${result.totalAmount.toLocaleString()}
                `;
                resultDetails.innerHTML = result.details;
            } else {
                const totalOrder = result.totalAmount + result.shippingFee;
                let summaryHTML = `
                    <strong>💰 運費計算結果</strong><br>
                    配送方式：${methodName}（${modeName}）<br>
                `;

                if (result.hasPrice) {
                    summaryHTML += `
                        商品總金額：NT$ ${result.totalAmount.toLocaleString()}<br>
                        運費：<span style="color: #e74c3c; font-weight: bold;">NT$ ${result.shippingFee.toLocaleString()}</span><br>
                        訂單總額：NT$ ${totalOrder.toLocaleString()}
                    `;
                } else {
                    summaryHTML += `
                        商品總金額：未填入單價<br>
                        運費：<span style="color: #e74c3c; font-weight: bold;">NT$ ${result.shippingFee.toLocaleString()}</span><br>
                        訂單總額：運費 + 未知商品金額
                    `;
                }

                resultSummary.innerHTML = summaryHTML;
                resultDetails.innerHTML = `
                    <strong>運費明細：</strong><br>
                    ${result.details || '無明細'}
                `;
            }

            resultContainer.style.display = 'block';

            resultContainer.scrollIntoView({
                behavior: 'smooth',
                block: 'nearest'
            });
        };

        waitForAdminCommon();
    });
    </script>
</body>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../images/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單管理 - 杰の御果園</title>
    <meta name="description" content="杰の御果園提供台灣高山優質水果，新鮮直送到府。精選梨子、水蜜桃、蘋果及各式水果禮盒，品質保證。">
    <meta name="keywords" content="台灣水果,高山水果,新鮮水果,水果禮盒,梨子,水蜜桃,蘋果,杰の御果園,果園直送,有機水果">
    <meta name="author" content="杰の御果園">
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin-common.css">
    <link rel="stylesheet" href="../css/order-panel.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        /* 匯出設定彈窗（Excel／黑貓宅急便）：內容比一般刪除確認彈窗多很多，
           不沿用 .confirm-dialog 給刪除確認用的紅色警示標頭跟 450px 窄版寬度，
           改成這兩個彈窗專屬的樣式，只鎖定各自的 id 底下，不影響其他頁面共用的確認彈窗 */
        #excel-export-modal .confirm-dialog-content,
        #blackcat-export-modal .confirm-dialog-content {
            max-width: 640px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        #excel-export-modal h3,
        #blackcat-export-modal h3 {
            background: linear-gradient(135deg, #4caf50, #43a047);
            flex-shrink: 0;
        }

        #excel-export-modal #excel-export-form,
        #blackcat-export-modal #blackcat-export-form {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 24px 30px 0;
        }

        #excel-export-modal .form-group,
        #blackcat-export-modal .form-group {
            background-color: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 14px;
        }

        #excel-export-modal .form-group:last-of-type,
        #blackcat-export-modal .form-group:last-of-type {
            margin-bottom: 0;
        }

        #excel-export-modal .form-group > label:first-child,
        #blackcat-export-modal .form-group > label:first-child {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
        }

        #excel-export-modal .radio-group,
        #excel-export-modal .checkbox-group,
        #blackcat-export-modal .radio-group,
        #blackcat-export-modal .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px 16px;
        }

        #excel-export-modal .radio-group label,
        #excel-export-modal .checkbox-group label,
        #blackcat-export-modal .radio-group label,
        #blackcat-export-modal .checkbox-group label {
            display: flex;
            align-items: center;
            font-weight: normal;
            margin-bottom: 0;
            cursor: pointer;
            white-space: nowrap;
        }

        #excel-export-modal .radio-group input,
        #excel-export-modal .checkbox-group input,
        #blackcat-export-modal .radio-group input,
        #blackcat-export-modal .checkbox-group input {
            /* order-panel.css 的 .form-group input 把寬度設成 100%（給文字欄位用的），
               勾選框/單選鈕繼承到會被撐成整欄寬，這裡要蓋回原本的寬度 */
            width: auto;
            flex: 0 0 auto;
            margin-right: 8px;
        }

        #excel-export-modal .date-range,
        #blackcat-export-modal .date-range {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #excel-export-modal .date-range input,
        #blackcat-export-modal .date-range input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        #excel-export-modal .confirm-dialog-buttons,
        #blackcat-export-modal .confirm-dialog-buttons {
            position: sticky;
            bottom: 0;
            background: #fff;
            padding: 16px 0 24px;
            margin-top: 8px;
            border-top: 1px solid #eee;
        }
    </style>

    <!-- 引入 SheetJS 用於 Excel 功能 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- 引入 Firebase SDK -->
    <script src="../js/firebase-config.js"></script>
    <script type="module">
        // 導入Firebase所需模組
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { 
            initializeFirestore,
            collection,
            doc,
            getDocs,
            getDocsFromServer,
            getDoc,
            updateDoc,
            deleteDoc,
            query,
            orderBy,
            where
        } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        
        // Firebase配置 - 更新為水果店配置
        const firebaseConfig = window.FIREBASE_CONFIG;
        
        // 初始化Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        // 自動偵測目前網路環境是否會擋掉預設的串流連線，會的話自動改用相容性更好的
        // 長輪詢，降低連線逾時、被誤判成「查無資料」的機率
        const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
        
        // 將Firebase服務變數暴露給全局使用
        window.firebaseServices = {
            auth: auth,
            db: db,
            getAuth,
            onAuthStateChanged,
            signOut,
            collection,
            doc,
            getDocs,
            getDocsFromServer,
            getDoc,
            updateDoc,
            deleteDoc,
            query,
            orderBy,
            where
        };
    </script>
</head>
<body>
    <header>
        <div class="container">
            <!-- 漢堡選單按鈕 (手機版) -->
            <button class="menu-toggle" id="menu-toggle">
                <i class="fas fa-bars"></i>
            </button>
            
            <!-- Logo 區域 - 更新為水果店品牌 -->
            <a href="../index.html" class="logo-container">
                <img src="../images/logo.jpg" alt="杰の御果園 logo" width="492" height="649" class="logo-image">
                <div class="logo">
                    <h1>杰の御果園</h1>
                    <p>管理系統</p>
                </div>
            </a>
            
            <!-- 導航選單 -->
            <nav id="main-nav">
                <ul>
                    <li><a href="dashboard.html">管理首頁</a></li>
                    <li><a href="orders.html" class="active">訂單管理</a></li>
                    <li><a href="products.html">商品管理</a></li>
                    <li><a href="users.html">會員管理</a></li>
                    <li><a href="messages.html">訊息管理</a></li>
                    <li><a href="shipping.html">運費設定</a></li>
                    <li><a href="bulletin.html">布告欄管理</a></li>
                </ul>
            </nav>
            
            <!-- 桌面版右側元素 -->
            <div class="header-right">
                <!-- 用戶資訊 -->
                <div class="user-profile" id="user-profile">
                    <div class="user-name" id="user-dropdown-btn">
                        <i class="fas fa-user-circle"></i>
                        <span id="username-display">管理員</span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                    <div class="user-menu" id="user-menu">
                        <a href="../index.html"><i class="fas fa-home"></i> 返回網站</a>
                        <a href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i> 登出</a>
                    </div>
                </div>
            </div>
        </div>
    </header>
    
    <!-- 半透明背景覆蓋 (用於手機版選單) -->
    <div class="menu-overlay" id="menu-overlay"></div>
    
    <main>
        <div class="admin-container">
            <h1 class="admin-title">訂單管理</h1>
            
            <!-- 未授權提示 -->
            <div id="unauthorized-section" class="admin-card" style="display: none;">
                <div class="card-header">
                    <h2>您沒有權限訪問此頁面</h2>
                </div>
                <div class="card-body" style="padding: 20px; text-align: center;">
                    <p>只有指定管理員可以訪問訂單管理系統。</p>
                    <p id="current-user-email"></p>
                    <a href="../index.html" class="btn btn-primary">返回首頁</a>
                </div>
            </div>
            
            <!-- 訂單管理區塊 -->
            <div id="orders-section" style="display: none;">
                <div class="admin-card">
                    <div class="card-header">
                        <h2>訂單管理面板</h2>
                        <div class="card-actions">
                            <button id="export-blackcat-btn" class="btn btn-success">
                                <i class="fas fa-cat"></i> 匯出黑貓宅急便格式
                            </button>
                            <button id="export-excel-btn" class="btn btn-success">
                                <i class="fas fa-file-excel"></i> 匯出詳細報表
                            </button>
                            <button id="refresh-btn" class="btn btn-outline">
                                <i class="fas fa-sync-alt"></i> 重新整理
                            </button>
                        </div>
                    </div>
                    
                    <div class="filter-section" style="padding: 20px; border-bottom: 1px solid #eee;">
                        <div class="filter-group">
                            <label for="status-filter">訂單狀態:</label>
                            <select id="status-filter" style="width: 150px; height: 40px; font-size: 15px; padding: 5px;">
                                <option value="all">全部訂單</option>
                                <option value="pending">待處理</option>
                                <option value="confirmed">待出貨</option>
                                <option value="shipped">已出貨</option>
                                <option value="completed">已完成</option>
                                <option value="cancelled">已取消</option>
                            </select>
                        </div>
                        <div class="search-group">
                            <input type="text" id="search-order" placeholder="搜尋訂單號碼、客戶名稱..." style="height: 40px;">
                            <button id="search-btn" class="btn btn-primary"><i class="fas fa-search"></i></button>
                        </div>
                    </div>
                    
                    <div class="orders-container">
                        <div class="order-list" id="order-list">
                            <p class="loading-message">載入訂單中...</p>
                        </div>
                        
                        <div class="order-detail" id="order-detail">
                            <div class="no-order-selected">
                                <p>請選擇一個訂單查看詳情</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <!-- 黑貓宅急便匯出設定彈窗 -->
    <div class="confirm-dialog" id="blackcat-export-modal">
        <div class="confirm-dialog-content">
            <h3>🚛 黑貓宅急便格式匯出設定</h3>
            <form id="blackcat-export-form">
                <div class="form-group">
                    <label>預設寄件人資訊設定:</label>
                    <div class="sender-info">
                        <div class="form-row">
                            <div class="form-field">
                                <label for="sender-name">預設寄件人姓名:</label>
                                <input type="text" id="sender-name" value="黃正杰" required>
                            </div>
                            <div class="form-field">
                                <label for="sender-phone">預設寄件人電話:</label>
                                <input type="text" id="sender-phone" value="0937163179" required>
                            </div>
                        </div>
                        <div class="form-field">
                            <label for="sender-address">預設寄件人地址:</label>
                            <input type="text" id="sender-address" value="台中市和平區中興路三段56號" required>
                        </div>
                        <div class="sender-note">
                            <i class="fas fa-info-circle"></i>
                            <small>送禮訂單會優先使用客戶填入的寄件人資訊，若客戶未填寫則使用上述預設值</small>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>匯出範圍:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="export-range" value="confirmed" checked> 待確認訂單</label>
                        <label><input type="radio" name="export-range" value="shipped"> 待出貨訂單</label>
                        <label><input type="radio" name="export-range" value="all"> 全部訂單</label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>水果分類篩選:</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="category" value="pear" checked> 梨子</label>
                        <label><input type="checkbox" name="category" value="persimmon" checked> 甜柿</label>
                        <label><input type="checkbox" name="category" value="peach" checked> 水蜜桃</label>
                        <label><input type="checkbox" name="category" value="apple" checked> 蘋果</label>
                        <label><input type="checkbox" name="category" value="gift" checked> 禮盒</label>
                        <label><input type="checkbox" name="category" value="featured" checked> 特色商品</label>
                    </div>
                </div>
                
                <div class="confirm-dialog-buttons">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-download"></i> 匯出黑貓格式
                    </button>
                    <button type="button" class="btn btn-secondary" id="cancel-blackcat-export">取消</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Excel匯出設定彈窗 -->
    <div class="confirm-dialog" id="excel-export-modal">
        <div class="confirm-dialog-content">
            <h3>📊 匯出詳細報表設定</h3>
            <form id="excel-export-form">
                <div class="form-group">
                    <label>匯出範圍:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="excel-export-range" value="all" checked> 全部訂單</label>
                        <label><input type="radio" name="excel-export-range" value="confirmed"> 僅待出貨訂單</label>
                        <label><input type="radio" name="excel-export-range" value="shipped"> 僅已出貨訂單</label>
                        <label><input type="radio" name="excel-export-range" value="completed"> 僅已完成訂單</label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>水果分類篩選:</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="excel-category" value="pear" checked> 梨子</label>
                        <label><input type="checkbox" name="excel-category" value="persimmon" checked> 甜柿</label>
                        <label><input type="checkbox" name="excel-category" value="peach" checked> 水蜜桃</label>
                        <label><input type="checkbox" name="excel-category" value="apple" checked> 蘋果</label>
                        <label><input type="checkbox" name="excel-category" value="gift" checked> 禮盒</label>
                        <label><input type="checkbox" name="excel-category" value="featured" checked> 特色商品</label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="excel-date-range">日期範圍 (可選):</label>
                    <div class="date-range">
                        <input type="date" id="excel-start-date" placeholder="開始日期">
                        <span>至</span>
                        <input type="date" id="excel-end-date" placeholder="結束日期">
                    </div>
                </div>
                
                <div class="confirm-dialog-buttons">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-download"></i> 開始匯出
                    </button>
                    <button type="button" class="btn btn-secondary" id="cancel-excel-export">取消</button>
                </div>
            </form>
        </div>
    </div>
    
    <footer>
        <div class="container">
            <div class="footer-content admin-footer">
                <p>&copy; 2025 杰の御果園管理系統。僅限授權人員使用。</p>
            </div>
        </div>
    </footer>
    
    <script src="../js/member.js"></script>
    <script src="../js/admin-common.js"></script>
    <script src="../js/order-panel.js"></script>
</body>
</html>
